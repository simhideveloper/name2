name: Publish to GitHub Pages

# GitHub Pages serves the gh-pages branch. This mirrors the working branch
# onto gh-pages after every push, so the public site always matches it.
on:
  push:
    branches: [cube-tac-toe, main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push this commit to gh-pages
        run: git push --force origin HEAD:gh-pages
